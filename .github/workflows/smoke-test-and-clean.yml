name: Smoke Tests & Cleanup (Barberia Smoke Purge)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar en Supabase'
        required: true
        default: 'purge_only'
        type: choice
        options:
          - purge_only          # Purga inmediata y garantizada de toda 'Barberia Smoke' en Supabase
          - run_tests_and_purge # Ejecuta los smoke tests en Supabase y purga todo rastro al finalizar

jobs:
  smoke_and_clean:
    name: Pruebas de Humo y Limpieza en Supabase
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar Secreto PROD_DATABASE_URL
        run: |
          if [ -z "${{ secrets.PROD_DATABASE_URL }}" ]; then
            echo "ERROR CRÍTICO: El secreto 'PROD_DATABASE_URL' no está configurado en GitHub Secrets."
            echo "Ve a Settings > Secrets and variables > Actions y crea 'PROD_DATABASE_URL'."
            exit 1
          fi
          echo "Secreto PROD_DATABASE_URL detectado correctamente."

      - name: Aplicar Migraciones Pendientes (Head)
        if: "${{ github.event.inputs.action == 'run_tests_and_purge' }}"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: "github-actions-temporary-secret-key-for-migrations-safe-123456"
          APP_ENV: "development"
        run: |
          echo "Asegurando que el esquema de la base de datos esté en su última versión..."
          alembic upgrade head

      - name: Ejecutar Pre-Deploy Smoke Tests
        if: "${{ github.event.inputs.action == 'run_tests_and_purge' }}"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: "github-actions-temporary-secret-key-for-migrations-safe-123456"
          APP_ENV: "development"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: "agenda-images"
        run: |
          echo "Iniciando suite de smoke tests contra la base de datos..."
          python test_predeploy_smoke.py

      - name: Purgar Garantizada de Barberia Smoke
        if: always()
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: "github-actions-temporary-secret-key-for-migrations-safe-123456"
          APP_ENV: "development"
        run: |
          echo "Ejecutando script de purga garantizada contra Supabase..."
          python scripts/clean_smoke_test_data.py --db-url "${{ secrets.PROD_DATABASE_URL }}"

      - name: Verificación Cero Barberia Smoke
        if: always()
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Verificando que no quede ningún registro Smoke en Supabase..."
          python -c "
          import os, sys
          from sqlalchemy import create_engine, text
          url = os.getenv('PROD_DATABASE_URL', '').strip()
          if url.startswith('postgres://'):
              url = url.replace('postgres://', 'postgresql://', 1)
          engine = create_engine(url, pool_pre_ping=True)
          with engine.connect() as conn:
              count_biz = conn.execute(text(\"SELECT count(*) FROM businesses WHERE name ILIKE '%smoke%' OR slug ILIKE '%smoke%'\")).scalar() or 0
              count_usr = conn.execute(text(\"SELECT count(*) FROM users WHERE email ILIKE '%smoke%' OR email ILIKE 'other.%@test.com'\")).scalar() or 0
              print(f'Negocios Smoke restantes: {count_biz}')
              print(f'Usuarios Smoke restantes: {count_usr}')
              if count_biz > 0 or count_usr > 0:
                  print('ERROR: La base de datos aún contiene residuos de smoke tests!')
                  sys.exit(1)
              print('CONFIRMADO: Cero registros de Barberia Smoke en Supabase.')
          "
